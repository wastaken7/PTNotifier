name: Release Binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: ptn

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
            archive: zip
            apt: ''

          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            ext: ''
            archive: tar.gz
            apt: ''

          - name: linux-x86_64-musl
            os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            ext: ''
            archive: tar.gz
            apt: musl-tools

          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            ext: ''
            archive: tar.gz
            apt: ''

          - name: linux-aarch64-musl
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            ext: ''
            archive: tar.gz
            apt: musl-tools

          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            ext: ''
            archive: tar.gz
            apt: ''

          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            ext: ''
            archive: tar.gz
            apt: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release version
        id: meta
        shell: bash
        run: echo "version=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        if: matrix.apt != ''
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ${{ matrix.apt }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Windows archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $bin = "target/${{ matrix.target }}/release/${{ env.BIN_NAME }}${{ matrix.ext }}"
          $archive = "dist/${{ env.BIN_NAME }}-${{ steps.meta.outputs.version }}-${{ matrix.name }}.zip"
          Compress-Archive -Path $bin -DestinationPath $archive -Force

      - name: Package Unix archive
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p dist
          BIN_PATH="target/${{ matrix.target }}/release/${{ env.BIN_NAME }}"
          strip "$BIN_PATH" || true
          tar -C "target/${{ matrix.target }}/release" -czf "dist/${{ env.BIN_NAME }}-${{ steps.meta.outputs.version }}-${{ matrix.name }}.tar.gz" "${{ env.BIN_NAME }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: dist
        run: sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
          files: dist/*
